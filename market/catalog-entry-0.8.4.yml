url: https://github.com/xienda/dsh-jev-verify
name: xienda/dsh-jev-verify
category: tools
description:
  en: "TypeSafe Jev (System One decision model) wired end to end into DeepSeek Harness (0.8.4). Six tools: jev_decision (1-25 parallel atomic verdicts in one call; noul/choice/score; typed answers with calibrated confidence; measured median 266-484 ms, p95 825-1468 ms; verdicts only, never prose), jev_choose (rank 2-10 candidate approaches by scoring each in parallel - fit 0-3 and risk - into an explicit composite with a recommended pick and no explanation), jev_usage (locally measured usage panel: calls, input/output tokens, estimated cost, latency median and p95, per-tool and question-type mix, rolling windows today/7d/30d/all/session, projected daily burn rate, per-day sparkline, optional local hard budgets), jev_overview (session ledger: calls, median latency, tokens, cost, guard events - recorded even when the dashboard page is disabled), jev_guard_status (guard counters plus a registrations block that surfaces any per-surface registration failure) and jev_verify (frozen 27-question live benchmark at concurrency 6: 96.3%, 26/27, measured median 282-484 ms, p95 1468 ms, 4.0-5.0 s wall versus 10.1 s serial). WHAT IS NEW IN 0.8.4 - honesty and participation. (1) The panel no longer implies a quota that does not exist: TypeSafe is a metered API with no balance endpoint, so with no local budget configured there is no "quota normal" verdict, no percentage bar against infinity and no reset countdown. `quota.budgetConfigured` now drives every surface (jev_usage text, /jev status page, pill payload, composer pill, full dashboard); without a budget the panel says pay-as-you-go, nothing resets, only locally measured usage is reported, and a "本地预算重置" countdown appears only when a local limit really exists. (2) The composer pill is money-first: it reads "Jev · 今日 $0.000534 · 29 次", and the popover leads with today cost and cumulative cost, call counts as secondary rows. (3) The auto-guard own Jev verdicts are metered: judgeRisky/judgeStall now return { noul, latencyMs, usage } and report through a new onJevCall event, recorded as kind "judge" / tool "auto-guard" entries. Previously a session could show safety.jevCalls 2 in jev_guard_status while the usage ledger still read zero calls. (4) Auto-triage (`autoTriage`, default on): an agent/pre-step hook judges the first step of every turn with one small Jev call (4 routing questions: intent, needs_judgment, judgment_kind, recommended_tool; ~1.5K input tokens; state clipped to 6000 chars; bounded by timeoutMs 4000) and injects the advice as a plugin-sourced user message. At most once per (agent, turn) via WeakMap, never blocks a step, and fails open on an unknown host shape, a missing key, a timeout or any API error. Because it is metered, a working plugin can no longer read "0 次". Configurable: autoTriage.{enabled,minChars,timeoutMs,maxCallsPerSession} = true/12/4000/200. (5) Harder system-prompt guidance: mandatory-trigger rules (classification/routing, priority/severity/satisfaction scoring, truth and compliance checks, structured extraction, choosing among 2-10 options), a ban on bypassing Jev "because I already know the answer", and the real cost magnitude (~$0.00002-0.0001 per call; 25 questions cost the same as 1). Every tool renders a structured in-chat view; a GUI Settings > Plugins card covers credentials, tool toggles, the auto-guard block, dashboard, guidance, usage/quota and autoTriage. Honest by design: TypeSafe exposes no balance, quota or billing endpoint (GET /v1/usage, /v1/quota, /v1/account, /v1/billing are all 404; only /v1/models responds), so the panel reports only locally measured usage against locally configured budgets - never a fabricated provider balance. No API key means an explicit error, never fabricated results. Every registration is quarantined so a failure degrades one feature, never the profile. Tests: 30/30 (npm test, ~2.5 s), including the new test/triage.test.mjs. Client half takes effect on a page refresh; server half (guard metering, auto-triage, guidance, status page) needs a host restart."
  zh: "为 DeepSeek Harness 端到端接入 TypeSafe Jev（System One 决策模型）0.8.4。 共六个工具：jev_decision（一次并行完成 1-25 个原子判定；noul/choice/score；返回类型化答案与校准置信度；实测中位 266-484 ms、p95 825-1468 ms；只出判定不写文本）、jev_choose（对 2-10 个候选方案并行打分——契合度 0-3 与风险——合成综合分并给出推荐，只给分不解释）、jev_usage（本机实测用量面板：调用数、input/output tokens、估算成本、延迟中位与 p95、按工具与题型分布、today/7d/30d/all/session 滚动窗口、全天用量预测、每日走势图、可选的本地硬预算）、jev_overview（会话账本：调用、中位延迟、tokens、成本、护栏事件；看板页面关闭时也照记）、jev_guard_status（护栏计数，并以 registrations 暴露分面注册失败）与 jev_verify（对线上 API 6 路并发运行冻结的 27 题基准：96.3%，26/27，实测中位 282-484 ms、p95 1468 ms、墙钟 4.0-5.0 s，串行需 10.1 s）。 0.8.4 的更新是「诚实」与「自己出手」两件事。 （1）面板不再暗示不存在的额度：TypeSafe 是按量计费、没有余额接口，因此没设本地预算时不再出现「额度正常」判定、不再对着「∞」画百分比条、也不再有重置倒计时。新增 quota.budgetConfigured 驱动全部呈现（jev_usage 文本、/jev 状态页、胶囊 JSON、输入框胶囊、完整看板）；无预算时明确写「按量计费、没有任何额度会重置、只报本机实测用量」，「本地预算重置」只在真的设了本地上限时出现。 （2）胶囊金钱优先：标签形如「Jev · 今日 $0.000534 · 29 次」，弹层以今日成本与累计成本为主行，调用次数退为次级行。 （3）护栏自己的 Jev 判定进账本：judgeRisky/judgeStall 改为返回 { noul, latencyMs, usage }，并通过新增的 onJevCall 事件以 kind "judge"、tool "auto-guard" 记账。此前一次会话里 jev_guard_status 报 safety.jevCalls 2，用量账本却仍是 0。 （4）自动预判（autoTriage，默认开启）：agent/pre-step 钩子在每轮第一步用一次小规模 Jev 调用判定（4 个路由问题：intent / needs_judgment / judgment_kind / recommended_tool；约 1.5K 输入 token；state 截断 6000 字符；timeoutMs 默认 4000），并把建议作为 plugin 来源用户消息注入上下文。WeakMap 保证每个 (agent, turn) 至多一次、绝不阻塞步骤，遇到未知宿主形态、缺 Key、超时或任何 API 错误一律 fail-open。因为这次调用计入账本，插件只要在工作，面板就不会再是 0。可配置 autoTriage.{enabled,minChars,timeoutMs,maxCallsPerSession} = true/12/4000/200。 （5）引导更硬：新增【强制触发】清单（分类/打标/路由、优先级/严重度/满意度打分、真伪与合规核查、结构化抽取、2-10 方案择优）与【禁止绕过】（不得以「我已经知道答案」跳过），并写明真实成本量级（约 $0.00002-0.0001；25 问与 1 问同价）。 每个工具都有对话内结构化视图；「设置 → 插件」卡片覆盖凭据、工具开关、自动护栏、看板、引导段、使用额度与 autoTriage。 诚实设计：TypeSafe 没有余额、额度或账单接口（GET /v1/usage、/v1/quota、/v1/account、/v1/billing 全部 404，只有 /v1/models 有响应），面板只报本机实测用量、对照你配置的本地预算，绝不编造供应商侧余额；未配置 Key 时给出明确报错。任何分面注册失败都被隔离，只降级一个功能，绝不拖垮整个 profile。 测试 30/30（npm test，约 2.5 s），含新增 test/triage.test.mjs。客户端部分刷新页面即生效；服务端部分（护栏记账、自动预判、引导、状态页）需重启宿主。"
